# GitHub Pages に2つの版を公開する（2026-11-16）
#   https://<ユーザー名>.github.io/<リポジトリ名>/          偏差値なし（ふつうの版）
#   https://<ユーザー名>.github.io/<リポジトリ名>/hensachi/ 偏差値つき（魅力度の偏差値のバッジが見える版）
# main に送る（push）たびに作り直す。手動でも実行できる（Actions タブの Run workflow）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 偏差値なしの版
        run: npx vite build --outDir _site
      - name: 偏差値つきの版
        run: npx vite build --mode hensachi --outDir _site/hensachi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
